name: Build VMProtectUnpacker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-capstone-x86feature-x64-windows-${{ runner.os }}-v2

      - name: Install Capstone via vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "C:/vcpkg")) {
            git clone https://github.com/microsoft/vcpkg C:/vcpkg
            C:/vcpkg/bootstrap-vcpkg.bat
          }
          C:/vcpkg/vcpkg.exe install "capstone[x86]:x64-windows"

      - name: Stage Capstone into expected path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:/Program Files/capstone/include"
          New-Item -ItemType Directory -Force -Path "C:/Program Files/capstone/lib"
          Copy-Item -Recurse -Force "C:/vcpkg/installed/x64-windows/include/*" "C:/Program Files/capstone/include/"
          Copy-Item -Force "C:/vcpkg/installed/x64-windows/lib/capstone.lib" "C:/Program Files/capstone/lib/"
          Copy-Item -Force "C:/vcpkg/installed/x64-windows/bin/capstone.dll" "C:/Program Files/capstone/lib/"

      - name: Configure (CMake)
        shell: pwsh
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      # --- Step penting: copy capstone.dll ke folder yang sama dengan exe ---
      - name: Copy capstone.dll next to exe
        shell: pwsh
        run: |
          $exeDir = "build/Release"
          if (!(Test-Path $exeDir)) { $exeDir = "build" }
          Copy-Item -Force "C:/vcpkg/installed/x64-windows/bin/capstone.dll" "$exeDir/capstone.dll"

      - name: Upload build artifact (exe + dll bundled)
        uses: actions/upload-artifact@v4
        with:
          name: VMProtectUnpacker
          path: |
            build/Release/VMProtectUnpacker.exe
            build/Release/capstone.dll
          if-no-files-found: warn
